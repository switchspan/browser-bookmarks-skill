schema_version: "1.1"
name: firefox-inplace-reorganize
context:
  scaffold_script: place-files.sh
expected_outcome: |
  Firefox bookmarks are changed in place through a safe mechanism (not raw SQL edits to places.sqlite), with a backup made first: a Reading folder holding Hacker News and Ars Technica and a Dev folder holding Rust in the bookmarks menu, other bookmarks preserved, and the user told when and how the change takes effect and how to restore.
